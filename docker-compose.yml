version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sicop_ve_postgres
    restart: always
    environment:
      POSTGRES_USER: sicop_admin
      POSTGRES_PASSWORD: sicop_secure_password_2026
      POSTGRES_DB: sicop_ve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicop_admin -d sicop_ve_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sicop_ve_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://sicop_admin:sicop_secure_password_2026@db:5432/sicop_ve_db
      JWT_SECRET: sicop_ve_enterprise_jwt_secret_2026
    ports:
      - "3000:3000"

volumes:
  postgres_data:

